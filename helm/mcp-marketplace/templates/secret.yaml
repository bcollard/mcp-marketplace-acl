{{- if .Values.tokenExchange.clientSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-te-credentials" (include "mcp-marketplace.fullname" .) }}
  labels:
    {{- include "mcp-marketplace.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ required "tokenExchange.clientSecret.secretValue is required when tokenExchange.clientSecret.create=true" .Values.tokenExchange.clientSecret.secretValue | quote }}
{{- end }}
{{- if .Values.jwtBearer.clientSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-jwt-credentials" (include "mcp-marketplace.fullname" .) }}
  labels:
    {{- include "mcp-marketplace.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ required "jwtBearer.clientSecret.secretValue is required when jwtBearer.clientSecret.create=true" .Values.jwtBearer.clientSecret.secretValue | quote }}
{{- end }}
