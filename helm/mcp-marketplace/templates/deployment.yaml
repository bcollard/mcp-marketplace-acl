apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-marketplace.fullname" . }}
  labels:
    {{- include "mcp-marketplace.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-marketplace.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-marketplace.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-marketplace.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: AUTH_HEADER_NAME
              value: {{ .Values.auth.headerName | quote }}
            - name: TOKEN_EXCHANGE_URL
              value: {{ required "tokenExchange.tokenEndpointUrl is required" .Values.tokenExchange.tokenEndpointUrl | quote }}
            - name: CLIENT_ID_TE_SAME_DOMAIN
              value: {{ required "tokenExchange.clientId is required" .Values.tokenExchange.clientId | quote }}
            - name: CLIENT_SECRET_TE_SAME_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-marketplace.teSecretName" . }}
                  key: clientSecret
            - name: CLIENT_ID_JWT_OTHER_DOMAIN
              value: {{ required "jwtBearer.clientId is required" .Values.jwtBearer.clientId | quote }}
            - name: CLIENT_SECRET_JWT_OTHER_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-marketplace.jwtSecretName" . }}
                  key: clientSecret
            - name: TOKEN_EXCHANGE_TARGET_RESOURCE
              value: {{ .Values.tokenExchange.targetResource | quote }}
            - name: TOKEN_EXCHANGE_TARGET_SCOPES
              value: {{ .Values.tokenExchange.targetScopes | quote }}
            - name: JWT_BEARER_TOKEN_EXCHANGE_URL
              value: {{ .Values.jwtBearer.tokenEndpointUrl | quote }}
            - name: JWT_BEARER_TARGET_RESOURCE
              value: {{ .Values.jwtBearer.targetResource | quote }}
            - name: JWT_BEARER_TARGET_SCOPES
              value: {{ .Values.jwtBearer.targetScopes | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
